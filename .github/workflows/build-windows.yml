name: build-windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      # 重点：npm全局安装指定版本pnpm，直接进node的PATH，Windows不会找不到
      - name: Install pnpm via npm
        run: npm install -g pnpm@11.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies (pnpm workspace)
        run: pnpm install

      - name: Frontend build (next build)
        run: pnpm build

      - name: Tauri build, output nsis + msi
        run: pnpm tauri build -- --bundles nsis,msi

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: brows3-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
