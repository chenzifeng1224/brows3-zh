name: build-windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
          run_install: false

      # Windows 关键修复：把pnpm目录写入GITHUB_PATH，后续步骤才能找到pnpm
      - name: Export PNPM_HOME to PATH
        run: |
          echo "$env:PNPM_HOME" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install

      - name: Frontend build (next build)
        run: pnpm build

      - name: Tauri build, output nsis + msi
        run: pnpm tauri build -- --bundles nsis,msi

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: brows3-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
